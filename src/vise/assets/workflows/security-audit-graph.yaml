metadata:
  name: "Security Audit"
  description: "Security audit: scan, triage, fix criticals, verify, document."
  version: "1.0.0"
  type: "graph"
  author: "vise"

nodes:
  - id: "scan"
    name: "Scan"
    is_start: true
    prompt_injection: |
      PHASE: SCAN
      Run the configured security scanners across the codebase.
      `.vise/quality.yaml` names them under `sast`, `sca`, and `secrets` — use
      those commands, not a guess, so `verify` re-runs the identical checks.
      1. Run SAST (bandit, semgrep, gosec, eslint-security, ...).
      2. Run dependency vulnerability scan (pip-audit, npm audit, cargo audit,
         govulncheck, osv-scanner).
      3. Run secret detection (gitleaks, trufflehog) on the working tree AND history.
      4. Persist raw findings to a scratch file for triage, and record which
         scanners RAN versus which were not installed. A scanner that did not run
         is a gap in the audit's scope, never a clean result — it goes in the
         report's NOT CHECKED list by name.
      This node is deliberately ungated: a scanner exiting nonzero here means it
      FOUND something, which is the reason to advance to triage, not to block.
      Signal: say "scan complete" when results are gathered.

  - id: "triage"
    name: "Triage"
    prompt_injection: |
      PHASE: TRIAGE
      Classify findings by severity and exploitability. Load the
      `security-baseline` skill first — it carries the CWE surface index, the
      severity ladder, and the CVE protocol this phase runs on.
      1. Tag every true positive with its CWE. One CWE per finding, the most
         specific that fits. No confident match means no ID — never invent one.
      2. Rank by the PRECONDITIONS an attacker needs (critical = unauthenticated
         and remote; high = any authenticated user reaches another's data; medium
         = needs privilege they must already hold; low = defense-in-depth). State
         the precondition — it is the severity argument.
      3. Do NOT compute a CVSS vector from a code read: the deployment, exposure,
         and data classification are unknown to you. Quote the project's score if
         it has one; never derive one.
      4. For each dependency advisory, quote the CVE/GHSA id and the affected and
         fixed ranges FROM THE TOOL'S OUTPUT, never from memory. Then establish
         reachability — does this project call the vulnerable path at all? An
         unreachable advisory is medium at most, and say why.
      5. Mark false positives with a reason.
      6. Build the fix-order list, criticals first.
      Signal: say "triaged" when classification is done.

  - id: "fix-criticals"
    name: "Fix Criticals"
    prompt_injection: |
      PHASE: FIX CRITICALS
      Address every critical and high severity finding.
      1. Fix the root cause, not the symptom — look for project-wide patterns.
      2. Use parameterized queries, safe escaping, and least-privilege primitives.
      3. Rotate any leaked credential before committing the fix.
      4. Add regression tests where feasible.
      Signal: say "criticals fixed" when patches are in place.

  - id: "verify"
    name: "Verify"
    # "criticals are gone" is the claim this node exists to check, so at minimum
    # the suite must run before the audit can be written up as fixed.
    # lsp_clean rides along: no node in this graph blocks Edit/Write, so
    # `verify` (the last non-terminal node, right before `doc`) is the last
    # chance to mechanically check the patches written in `fix-criticals`.
    # The scanners re-run HERE, not at `scan`. This is the node whose claim is
    # "the criticals are gone", so this is the only place their exit code is
    # evidence rather than noise — at `scan` a nonzero exit means the audit found
    # something, which must not block the path to triage.
    #
    # quality_check, not command_exit: command_exit fails CLOSED on a missing
    # binary, which is why the previous version of this node shipped four
    # commented-out lines that gated nothing on every repo. quality_check reads
    # the check name out of .vise/quality.yaml and skip-passes with
    # source="asserted" when the profile, the key, or the binary is absent — so
    # an unconfigured repo is not blocked, and the record says "not configured"
    # instead of presenting as clean.
    validators:
      - type: tests_pass
        weight: 1.0
      - type: lsp_clean
        weight: 0.3
      - type: quality_check
        check: sast
        weight: 1.0
      - type: quality_check
        check: sca
        weight: 1.0
      - type: quality_check
        check: secrets
        weight: 1.0
    prompt_injection: |
      PHASE: VERIFY
      Re-run the scanners and confirm criticals are gone.
      1. Re-run SAST, dependency, and secret scans.
      2. Diff against the pre-fix baseline — no new findings allowed.
      3. Confirm regression tests pass.
      4. Confirm no functional regressions in the broader test suite.
      Signal: say "verified" when scans are clean.

  - id: "doc"
    name: "Document"
    is_end: true
    prompt_injection: |
      PHASE: DOCUMENT
      Record what was found, what was fixed, and what remains.
      1. Write an audit report: scope, methodology, findings, fixes. Every
         finding carries file:line, severity, and its CWE; every dependency
         finding carries the advisory id, reachability, and the fixed version.
      2. List accepted-risk findings with rationale and review date. An accepted
         risk with no stated mitigation is an unfixed finding with better
         wording — say which one it is.
      2b. List every scanner that did not run, by name, under NOT CHECKED.
      3. Update SECURITY.md with any new disclosure or hardening guidance.
      4. Schedule the next audit cycle.
      Signal: audit complete — report filed.

edges:
  - id: "scan-to-triage"
    from: "scan"
    to: "triage"
    condition:
      type: "phrase"
      phrases:
        - "scan complete"
        - "next phase"
        - "advance"

  - id: "triage-to-fix"
    from: "triage"
    to: "fix-criticals"
    condition:
      type: "phrase"
      phrases:
        - "triaged"
        - "next phase"
        - "advance"

  - id: "fix-to-verify"
    from: "fix-criticals"
    to: "verify"
    condition:
      type: "phrase"
      phrases:
        - "criticals fixed"
        - "next phase"
        - "advance"

  - id: "verify-to-doc"
    from: "verify"
    to: "doc"
    condition:
      type: "phrase"
      phrases:
        - "verified"
        - "next phase"
        - "advance"
