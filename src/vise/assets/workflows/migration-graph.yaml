metadata:
  name: "DB Migration Sprint"
  description: "Database migration sprint: design schema, implement, check reversibility, benchmark, apply."
  version: "1.0.0"
  type: "graph"
  author: "vise"

nodes:
  - id: "design"
    name: "Design"
    is_start: true
    prompt_injection: |
      PHASE: DESIGN
      Plan the schema change before writing migration code.
      1. Identify the tables, columns, indexes, and constraints involved.
      2. Document the data shape before and after.
      3. Note backfill needs, default values, and nullable transitions.
      4. Decide online vs offline migration based on table size and lock cost.
      5. Sketch rollback strategy in the same document.
      Signal: say "migration designed" when ready to implement.

  - id: "spec"
    name: "Spec"
    # A schema change IS a contract change — the shape other systems read is
    # exactly what a spec is for. Same mandatory OpenSpec gate as feature-dev,
    # and doubly load-bearing here: this is the one workflow whose end phase
    # cannot be undone in production, so the written record of what the data
    # was supposed to become has to exist before the DDL does.
    validators:
      - type: openspec
        require: deltas
        weight: 1.0
      - type: openspec
        require: validated
        weight: 0.5
    prompt_injection: |
      PHASE: SPEC — OpenSpec proposal (mandatory)
      No migration code yet. Record the contract change this migration makes.
      1. openspec new change <kebab-case-name>
      2. openspec status --change <name> --json   (artifact order + paths)
      3. Under openspec/changes/<name>/specs/<capability>/spec.md write the
         delta: ## MODIFIED Requirements for a changed data contract,
         ## ADDED for new entities, ## REMOVED for dropped ones. Every
         "### Requirement:" needs at least one "#### Scenario:".
      4. State the reverse path as a scenario, not prose — the reversibility
         phase later has to execute exactly what you write here.
      5. openspec validate --all --strict
      Signal: the gate opens on its own once the deltas validate — no phrase.

  - id: "implement"
    name: "Implement"
    prompt_injection: |
      PHASE: IMPLEMENT
      Work the checklist in openspec/changes/<name>/tasks.md as you go.
      Write the migration files (forward and reverse).
      1. Use the project's migration tool conventions (alembic, prisma, sqlx, etc.).
      2. Keep DDL changes idempotent where possible.
      3. Split data backfill from schema change when the dataset is large.
      4. Add the matching ORM/model code updates.
      Signal: say "migration implemented" when files are written.

  - id: "reversibility-check"
    name: "Reversibility Check"
    # This node stays advisory ON PURPOSE, unlike release:tests. There is no
    # universal rollback command to hardcode, command_exit fails closed on a
    # missing binary, and tests_pass proves nothing about reversibility. Pick
    # your tool's round-trip and uncomment — a mechanical round-trip here is the
    # single highest-value gate in this graph, because it is the one phase where
    # a false green is irreversible in production.
    # validators:
    #   - {type: command_exit, cmd: ["alembic", "downgrade", "-1"], weight: 1.0}
    #   - {type: command_exit, cmd: ["bash", "-lc", "alembic upgrade head && alembic downgrade -1 && alembic upgrade head"], weight: 1.0}
    #   - {type: command_exit, cmd: ["npx", "prisma", "migrate", "reset", "--force"], weight: 1.0}
    #   - {type: command_exit, cmd: ["bin/rails", "db:rollback", "STEP=1"], weight: 1.0}
    #   - {type: command_exit, cmd: ["migrate", "-path", "migrations", "-database", "$DB_URL", "down", "1"], weight: 1.0}
    prompt_injection: |
      PHASE: REVERSIBILITY CHECK
      Verify the migration can be safely rolled back.
      1. Run the forward migration against a fresh test DB.
      2. Run the reverse migration and confirm the schema returns to baseline.
      3. EXECUTE the round-trip — do not reason about it. Paste the actual
         command and its output. "The down migration looks correct" is the
         failure this phase exists to prevent; unlike every other phase in
         this workflow, getting it wrong cannot be undone in production.
      4. Confirm no data loss in the reverse path for production-shape data.
      5. Document any irreversible steps explicitly.
      Signal: say "reversible" when the round-trip has actually run and passed.

  - id: "bench"
    name: "Benchmark"
    # Last gate before an irreversible phase: the change that authorised this
    # migration must be fully ticked off before `apply` is reachable. Lives
    # here rather than on `apply` because a node gate runs on traverse OUT,
    # and `apply` is is_end — its validators would never run.
    validators:
      - type: openspec
        require: tasks_complete
        weight: 1.0
    prompt_injection: |
      PHASE: BENCHMARK
      Measure migration cost against production-shape data.
      1. Seed a copy of production-volume data into a staging DB.
      2. Time the forward migration and record lock duration.
      3. Confirm acceptable downtime window (or zero with online strategy).
      4. Flag any query-plan regressions on hot paths.
      Signal: say "benchmark passed" when timings are within budget.

  - id: "apply"
    name: "Apply"
    is_end: true
    prompt_injection: |
      PHASE: APPLY
      Apply the migration to the target environment.
      1. Take a fresh backup of the target DB before running.
      2. Run the migration with monitoring on lock and replication lag.
      3. Verify post-migration row counts and constraint integrity.
      4. Fold the delta into the living specs: openspec archive <name>.
         The schema on disk and the spec describing it must land together, or
         the next migration's delta is written against a baseline that lies.
      5. Commit migration files with a Why: explaining the schema change.
      Signal: migration applied — workflow complete.

edges:
  - id: "design-to-spec"
    from: "design"
    to: "spec"
    condition:
      type: "phrase"
      phrases:
        - "migration designed"
        - "next phase"
        - "advance"

  - id: "spec-to-implement"
    from: "spec"
    to: "implement"
    condition:
      type: "validators_green"

  - id: "implement-to-reversibility"
    from: "implement"
    to: "reversibility-check"
    condition:
      type: "phrase"
      phrases:
        - "migration implemented"
        - "next phase"
        - "advance"

  - id: "reversibility-to-bench"
    from: "reversibility-check"
    to: "bench"
    condition:
      type: "phrase"
      phrases:
        - "reversible"
        - "next phase"
        - "advance"

  - id: "bench-to-apply"
    from: "bench"
    to: "apply"
    condition:
      type: "phrase"
      phrases:
        - "benchmark passed"
        - "next phase"
        - "advance"
