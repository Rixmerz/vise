name: deploy-and-validate
description: >
  Deploy a service, tail its startup logs, and assert the expected
  health-check string appears within the output.
  SHIPS UNBOUND — deploy.update and deploy.tail_logs have no default
  binding, so recipe_run halts at step 1 until you bind a deploy MCP
  via capability_set.

# GAP — vise bundles no deploy MCP. Every step below dispatches on a
# capability that resolves UNBOUND out of the box; recipe_run returns
# "capability '<name>' is unresolved — use capability_set to assign a tool"
# at the first such step. That is the intended GAP-first behaviour: a false
# binding would report a green instead of surfacing the missing tool.

inputs:
  - service_name
  - image_tag
  - health_pattern

steps:
  - id: deploy
    capability: deploy.update
    description: Roll out the new image to the service
    args:
      service: "{{ inputs.service_name }}"
      image: "{{ inputs.image_tag }}"

  - id: tail
    capability: deploy.tail_logs
    description: Capture startup logs from the newly deployed service
    args:
      service: "{{ inputs.service_name }}"
      lines: 100

  - id: validate
    capability: meta.assert
    description: Verify the health-check pattern appears in startup logs
    args:
      condition: match
      pattern: "{{ inputs.health_pattern }}"
      against: "{{ steps.tail.output.logs }}"
