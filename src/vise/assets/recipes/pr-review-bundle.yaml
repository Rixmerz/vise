name: pr-review-bundle
description: >
  Run a full PR review bundle: diff the branch, summarise the changes
  with AI, run security findings, and post a review comment.
  SHIPS UNBOUND — vcs.diff, ai.summarize, code.security.findings and
  vcs.pr.comment have no default binding, so recipe_run halts at step 1
  until you bind them via capability_set.
  Once bound, recipe_run does not execute the steps — vise ships no MCP
  dispatch layer — it returns an ordered plan (resolved tool + rendered args
  per step) for the calling agent to execute itself.

# GAP — vise bundles no VCS, AI or security-scanner MCP. Every step below
# dispatches on a capability that resolves UNBOUND out of the box; recipe_run
# returns "capability '<name>' is unresolved — use capability_set to assign
# a tool" at the first such step. That is the intended GAP-first behaviour:
# a false binding would report a green instead of surfacing the missing tool. Once bound, recipe_run returns a step-by-step PLAN (resolved tool + rendered args), not an execution result — vise has no MCP dispatch layer.

inputs:
  - pr_number
  - base_branch

steps:
  - id: diff
    capability: vcs.diff
    description: Get the unified diff for the PR
    args:
      base: "{{ inputs.base_branch }}"
      pr: "{{ inputs.pr_number }}"

  - id: summarize
    capability: ai.summarize
    description: Produce a concise summary of the diff
    args:
      text: "{{ steps.diff.output.diff }}"
      max_tokens: 512

  - id: security
    capability: code.security.findings
    description: Retrieve open security findings for the changed files
    args:
      pr: "{{ inputs.pr_number }}"

  - id: comment
    capability: vcs.pr.comment
    description: Post the review summary and security findings as a PR comment
    args:
      pr: "{{ inputs.pr_number }}"
      body: |
        ## AI Review Summary

        {{ steps.summarize.output.summary }}

        ## Security Findings

        {{ steps.security.output.findings }}
