name: loop-ci-sweeper
description: >
  L2 assisted CI sweeper: poll deploy/CI status, classify failures with AI,
  summarise a proposed fix, and PROPOSE a chat notification. The runner
  halts before sending the notification (notify.chat is a sideeffect) and
  returns {paused_for_approval} for human sign-off. Graduable to L3 once
  the D readiness gate passes and VISE_GOAL_GATE=1 is armed.
  Trigger from an external systemd timer or crontab at the cadence below.
  SHIPS UNBOUND — deploy.status, ai.classify, ai.summarize and notify.chat
  have no default binding, so recipe_run halts at step 1 until you bind them
  via capability_set. The cadence below is documentation, not a scheduler:
  the plugin installs no cron entry or systemd timer — you create it yourself.

# GAP — vise bundles no deploy, AI or chat MCP. The steps below dispatch on
# capabilities that resolve UNBOUND out of the box; recipe_run returns
# "capability '<name>' is unresolved — use capability_set to assign a tool"
# at the first such step. That is the intended GAP-first behaviour: a false
# binding would report a green instead of surfacing the missing tool. Once bound, recipe_run returns a step-by-step PLAN (resolved tool + rendered args), not an execution result — vise has no MCP dispatch layer.

# External scheduler hint:
#   */30 * * * *  vise recipe run loop-ci-sweeper --input environment=staging
cadence: "*/30 * * * *"

# Estimated token budget for the D cost gate (author estimate).
cost: 5000

tier: L2

inputs:
  - environment  # deploy environment to watch (e.g. "staging", "production")

steps:
  - id: status
    capability: deploy.status
    description: Poll current deploy/CI status for the environment
    args:
      environment: "{{ inputs.environment }}"

  - id: classify
    capability: ai.classify
    description: Classify any failures reported in the status output
    args:
      text: "{{ steps.status.output.status }}"
      labels:
        - flaky_test
        - infra_failure
        - code_regression
        - timeout
        - unknown

  - id: summarize
    capability: ai.summarize
    description: Summarise the failure classification and propose a fix workflow
    args:
      text: "{{ steps.classify.output.label }}"
      max_tokens: 512

  - id: notify
    capability: notify.chat
    description: >
      Deliver the fix proposal via chat (L2 halts here for approval).
    args:
      message: "{{ steps.summarize.output.summary }}"
