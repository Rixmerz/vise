name: scrape-and-store
description: >
  Scrape a URL and store the extracted content to a file.
  SHIPS UNBOUND — web.scrape and fs.write have no default binding, so
  recipe_run halts at step 1 until you bind a scraper MCP and a
  filesystem-write MCP via capability_set.

# GAP — vise bundles no scraper and no fs-write MCP. Both steps below
# dispatch on capabilities that resolve UNBOUND out of the box; recipe_run
# returns "capability '<name>' is unresolved — use capability_set to assign
# a tool" at the first such step. That is the intended GAP-first behaviour:
# a false binding would report a green instead of surfacing the missing tool.

inputs:
  - url
  - output_path

steps:
  - id: scrape
    capability: web.scrape
    description: Fetch and extract content from the target URL
    args:
      url: "{{ inputs.url }}"

  - id: store
    capability: fs.write
    description: Persist scraped content to the output file
    args:
      path: "{{ inputs.output_path }}"
      content: "{{ steps.scrape.output.content }}"
