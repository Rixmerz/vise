name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e '.[dev]'
      # vise ships a lint_pass validator and gates other repos on it; run it on
      # ourselves. Same command the validator defaults to.
      - name: Lint
        run: ruff check . --exclude .claude
      # One instrumented run, not two: `coverage run -m pytest` IS the test run,
      # so a separate plain `pytest -q` step doubles CI time for no extra signal.
      # vise ships coverage-gate guidance and gates other repos on it; measure
      # ourselves. Paths and the floor both live in pyproject.toml — passing
      # --fail-under here is how the floor came to exist in four copies with
      # four different numbers, of which the lowest silently won.
      #
      # `combine` is not optional: every hook is tested by launching it as its
      # own interpreter, and those children write their own data files.
      # Reporting without combining measures the parent only and puts the
      # best-covered package in the repo at 0%.
      - name: Test + coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage combine
          python -m coverage report
