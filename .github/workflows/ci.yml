name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e '.[dev]'
      # vise ships a lint_pass validator and gates other repos on it; run it on
      # ourselves. Same command the validator defaults to.
      - name: Lint
        run: ruff check . --exclude .claude
      # One instrumented run, not two: `coverage run -m pytest` IS the test run,
      # so a separate plain `pytest -q` step doubles CI time for no extra signal.
      # vise ships coverage-gate guidance and gates other repos on it; measure
      # ourselves. Paths live in [tool.coverage.run]. The threshold is a ratchet
      # meant to move upward — set below the 67% we hold today, because a gate
      # nobody meets gets overridden and an override habit is worse than no gate.
      - name: Test + coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage report --fail-under=62
