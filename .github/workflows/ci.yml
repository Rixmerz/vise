name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e '.[dev,design]'
      # vise ships three design gates that drive a real browser, and CI had no
      # browser — so `test_design_gates_render.py` skipped every run and the
      # gates shipped exercised by nobody. `browser_status()` degrades to a skip
      # rather than a failure, which is right for a contributor without
      # chromium and wrong for the pipeline that is supposed to be the check.
      - name: Install chromium for the render gates
        run: python -m playwright install --with-deps chromium
      # vise ships a lint_pass validator and gates other repos on it; run it on
      # ourselves. Same command the validator defaults to.
      - name: Lint
        run: ruff check . --exclude .claude
      # One instrumented run, not two: `coverage run -m pytest` IS the test run,
      # so a separate plain `pytest -q` step doubles CI time for no extra signal.
      # vise ships coverage-gate guidance and gates other repos on it; measure
      # ourselves. Paths and the floor both live in pyproject.toml — passing
      # --fail-under here is how the floor came to exist in four copies with
      # four different numbers, of which the lowest silently won.
      #
      # `combine` is not optional: every hook is tested by launching it as its
      # own interpreter, and those children write their own data files.
      # Reporting without combining measures the parent only and puts the
      # best-covered package in the repo at 0%.
      - name: Test + coverage
        run: |
          python -m coverage run -m pytest -q
          python -m coverage combine
          python -m coverage report
      # `.vise/quality.yaml` says every check in it "already runs in CI". That
      # was false for four of its eight, and the file whose whole job is to
      # state what this repo really verifies was the one saying it. These are
      # the two that are deterministic, about vise's own code, and clean today,
      # so they gate.
      - name: SAST (bandit, medium and up)
        run: python -m bandit -q -r src/vise -x src/vise/tests --severity-level medium
      - name: Secret scan
        run: python -m detect_secrets scan
      # Reporting, not gating, and the reason is in security-baseline: a
      # dependency advisory needs reachability triage by a person before it
      # means anything, and an SCA gate that goes red on a transitive advisory
      # nobody has read is how an override habit starts. Today's findings are
      # all against pip and setuptools — the venv's own build tooling, which
      # vise never imports.
      - name: Dependency advisories (report only)
        continue-on-error: true
        run: python -m pip_audit
