[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vise-mcp"
version = "0.1.0a18"
description = "Phase-gated workflow enforcer, cross-project experience memory, and git snapshots for Claude Code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Rixmerz" },
]
keywords = ["mcp", "claude-code", "workflow", "agent", "memory", "snapshots"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastmcp>=2.0.0",
    "fastembed>=0.4.0",
    "rich",
    "numpy",
    "pydantic",
    "pyyaml",
]

[project.optional-dependencies]
# The render gates (ui_layout, ui_contrast) drive a real browser: contrast
# against an effective background and per-breakpoint geometry are properties
# of the rendered document, and no stdlib module renders a page. Kept out of
# the core install so `pip install vise` never pulls a browser — every module
# that needs playwright imports it lazily, inside the function that uses it.
design = ["playwright>=1.40"]
dev = [
    "bandit>=1.7.0",
    "coverage>=7.0.0",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[project.scripts]
vise = "vise.cli.main:main"
vise-mcp = "vise.__main__:run"

[tool.hatch.build.targets.wheel]
packages = ["src/vise"]

[tool.hatch.build.targets.sdist]
include = [
    "src/vise",
    "README.md",
    "pyproject.toml",
]

[tool.coverage.run]
# Here rather than on the CI command line, so the coverage step stays a plain
# `coverage run -m pytest -q` and local runs measure the same thing CI does.
source = ["src/vise"]
omit = ["*/tests/*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["src/vise/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Pinned, not defaulted. With no `select`, the rule set is whatever the
# installed ruff calls default — and that moves between versions. CI resolved
# `ruff>=0.6.0` to 0.16.1, whose expanded default reported 318 findings against
# a tree that was clean under 0.15.x. A gate whose rules depend on the day you
# ran it is not a gate.
#
# These four are ruff's long-standing default: pyflakes plus the pycodestyle
# errors that catch real breakage. The wider families (BLE001, DTZ, S, PLW, …)
# were evaluated and are ~95% noise on this codebase — 104 of the 318 were
# BLE001 against deliberate fail-open `except Exception` handlers, which is the
# documented contract for every vise hook. Widen this list on purpose, one
# family at a time, never by upgrading the linter.
select = ["E4", "E7", "E9", "F"]
