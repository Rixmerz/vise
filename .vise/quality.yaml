# vise's own quality profile — the one it asks every other repo to write.
#
# Consumed by the `quality_check` validator: a workflow node gates on a check
# NAME and this file says what that name runs here. A check absent from this
# map skip-passes with source="asserted", so the gate stays honest about what
# it did not look at rather than blocking a repo for lacking a tool.
#
# Only list what this repo really has. Everything here is installed in .venv.
#
# What CI does with each one, per check, because a blanket claim is a claim
# nobody can check:
#   gated in CI    lint, unit, coverage, sast, secrets, dead_code
#                  dead_code is F401/F841 and therefore already inside the
#                  `lint` run; it is listed on its own so a node gating on it
#                  alone gets a real answer instead of a skip
#   reported only  sca — a dependency advisory needs reachability triage by a
#                  person before it means anything (see security-baseline), and
#                  a gate that goes red on a transitive advisory nobody has read
#                  is how an override habit starts
#   not in CI      spec — openspec is a Node CLI and is not installed there
#
# This header used to make one blanket assertion covering all eight. Four were
# not run at all and a fifth ran at a different threshold, so the file whose job
# is to state what a merge has passed was the one saying it had passed more than
# it had. `test_quality_profile_claims_match_ci.py` now fails when this list and
# the workflow disagree.
#
# Every command runs through .venv/bin/python. A bare `pytest` resolves against
# the MCP SERVER's PATH, not this project's — which found the system pytest, ran
# it against a python without vise's dependencies, and reported 5 failures and
# 10 collection errors against a suite that is 745-green in the venv. A gate
# that goes red for environment reasons is worse than no gate: it teaches you
# to pass VISE_NODE_GATE_OVERRIDE=1.

checks:
  lint: [".venv/bin/python", "-m", "ruff", "check", ".", "--exclude", ".claude"]

  # One instrumented run, not two. `coverage run -m pytest` IS the unit run, so
  # `coverage report` below reads data this gate just produced. A plain `pytest`
  # here writes no coverage data at all, which left `report` grading whatever
  # stale .coverage happened to be on disk — a green threshold measured against
  # an unrelated run from hours earlier. Same fold as the CI step.
  unit: [".venv/bin/python", "-m", "coverage", "run", "-m", "pytest", "-q"]

  # `combine` before `report`, and therefore a shell, because a check is one
  # argv and these are two commands. Under [tool.coverage.run] parallel — which
  # is what makes a hook launched as its own interpreter measurable at all —
  # the run writes .coverage.<host>.<pid> and nothing writes .coverage, so a
  # bare `report` finds no data and the gate goes red for a reason that has
  # nothing to do with the code.
  #
  # `;` and not `&&`: combine exits 1 when there is nothing left to combine,
  # which is the state right after a previous run of this same check. `report`
  # is the judge here — it fails on absent data too, so nothing is hidden, and
  # running the check twice no longer goes red for a reason that is not about
  # the code. The string is a fixed literal; nothing in it is interpolated.
  coverage: ["/bin/sh", "-c",
             ".venv/bin/python -m coverage combine >/dev/null 2>&1; .venv/bin/python -m coverage report"]

  # dead_code is ruff's F401/F841, already inside the `lint` run above — listed
  # separately so a node gating on dead_code alone gets a real answer instead
  # of a skip.
  dead_code: [".venv/bin/python", "-m", "ruff", "check", ".", "--exclude", ".claude",
              "--select", "F401,F841"]

  # Medium and up. bandit reports 129 Low against this tree, and they are
  # B110/B112 (try/except/pass) plus B404/B603/B607 (subprocess) — the
  # deliberate fail-open handlers every vise hook is contractually required to
  # have, and the git calls the snapshot and isolation layers are made of — the same ~95%-noise shape as
  # ruff's BLE001, which is why [tool.ruff.lint] does not select it either.
  # Gating on Low would mean either 89 permanent findings or 89 #nosec comments;
  # neither is a security control. Medium+ was one real finding (a SHA1 without
  # usedforsecurity=False, which raises outright under a FIPS provider).
  sast: [".venv/bin/python", "-m", "bandit", "-q", "-r", "src/vise",
         "-x", "src/vise/tests", "--severity-level", "medium"]

  # NOT --strict, which is what quality.example.yaml used to recommend. --strict
  # fails when ANY distribution cannot be audited, and a project pip-installed
  # into its own venv is never on PyPI — so `pip-audit --strict` exits 1 forever
  # on essentially every Python repo during development. Verified: plain
  # pip-audit exits 0 here and exits 1 with 10 CVEs against urllib3==1.26.0, so
  # it still fires on a real finding.
  sca: [".venv/bin/python", "-m", "pip_audit"]

  # detect-secrets, not gitleaks: same job, and being pure Python it can come
  # from [dev] instead of needing a Go binary the whole team installs by hand.
  #
  # NO --all-files. That flag walks everything on disk including .venv, which
  # here means 99 site-packages: bandit's own hardcoded-password test fixtures,
  # PIL matching the AWS key regex, every SBOM hash. 127KB of findings, none of
  # them this repo's. Bare `scan` reads git's file list, which is the only set
  # that can actually leak.
  #
  # This scans the WORKING TREE. It does not read history, and history is where
  # committed credentials survive after the "oops" commit removes them. Checked
  # separately, once: 120 commits, no AWS/GitHub/Slack/Anthropic/private-key
  # pattern, and no .env/.pem/.key/credential file ever added. Re-check with:
  #   git log -p --all | grep -Ei 'AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|BEGIN [A-Z ]*PRIVATE KEY'
  secrets: [".venv/bin/python", "-m", "detect_secrets", "scan"]

  # OpenSpec planning artifacts. Bound here so a node can gate on the check
  # NAME `spec` the same way it gates on `lint` — but note this is the WEAKER
  # of the two paths to the same tool. The dedicated `openspec` validator
  # (require: deltas / tasks_complete) reads openspec/ in pure Python and FAILS
  # closed; a quality_check skip-passes when unbound. Use `openspec` for the
  # mandatory phase gate and this entry for ad-hoc `quality-gate` runs.
  #
  # `openspec` is a Node CLI, so unlike every other command here it is not in
  # .venv. That is exactly why the mandatory gate does not depend on it.
  spec: ["openspec", "validate", "--all", "--strict"]

  # Deliberately absent, and each absence is a real gap, not an oversight:
  #   types       — no mypy/pyright config here yet
  #   complexity  — ruff C901 is not enabled; see [tool.ruff.lint] select
  #   deps        — no import-linter contract defined
  #   contracts   — vise exposes MCP tools, not an HTTP schema
  #   integration / e2e — vise's suite is unit + subprocess; no separate tier
  # Each one skip-passes and says so. Bind it or accept the risk knowingly.
